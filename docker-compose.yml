name: alphalens

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_research
      POSTGRES_USER: ai_research
      POSTGRES_PASSWORD: ai_research
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_research -d ai_research"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      APP_ENV: production
      DATA_BACKEND: database
      DATABASE_URL: postgresql+psycopg://ai_research:ai_research@db:5432/ai_research
      ALLOWED_ORIGINS: http://localhost:8080
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_KEY_ENV: LLM_API_KEY
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-eastmoney_public}
      MARKET_DATA_TIMEOUT_SECONDS: ${MARKET_DATA_TIMEOUT_SECONDS:-12}
      MARKET_ANNOUNCEMENT_LIMIT: ${MARKET_ANNOUNCEMENT_LIMIT:-8}
      TASK_RECOVERY_ENABLED: ${TASK_RECOVERY_ENABLED:-true}
    command: >
      sh -c "cd /app/backend && alembic upgrade head &&
      python /app/scripts/import_seed_data.py --database-url $$DATABASE_URL &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
